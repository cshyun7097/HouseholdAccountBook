spring:
  application:
    name: householdaccountbook
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${HOST_VALUE}:5432/householdaccountbook_5zlt?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: root
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show-sql: true
        format-sql: true
    hibernate:
      ddl-auto: update	# 실서버에서는 validate로 설정해야 한다!

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
