spring:
  application:
    name: householdaccountbook
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/householdaccountbook
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect	# 이 부분 주의!
    properties:
      hibernate:
        show-sql: true
        format-sql: true
    hibernate:
      ddl-auto: update	# 실서버에서는 validate로 설정해야 한다!

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
