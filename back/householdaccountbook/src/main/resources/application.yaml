spring:
  application:
    name: householdaccountbook
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/householdaccountbook}
    driver-class-name: org.postgresql.Driver
    username: root
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    hibernate:
      ddl-auto: create-drop	# 실서버에서는 validate로 설정해야 한다!

server:
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
