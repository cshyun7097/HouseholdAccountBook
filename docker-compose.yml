services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: householdaccountbook
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20

  back:
    build: ./back/householdaccountbook
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/householdaccountbook
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front/rnwClient
    ports:
      - "8081:8081"
    depends_on:
      - back

volumes:
  db-data:
